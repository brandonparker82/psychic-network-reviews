<svg xmlns="http://www.w3.org/2000/svg" width="720" height="544" viewBox="0 0 720 544" role="img" aria-labelledby="title desc">
<title id="title">What can you actually check?</title>
<desc id="desc">Separate platform safeguards from reading claims</desc>
<rect width="720" height="544" rx="24" fill="#f6f3eb"/>
<rect x="32" y="32" width="7" height="66" rx="3" fill="#b68b47"/>
<text x="56" y="61" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#16352f">What can you actually check?</text>
<text x="56" y="95" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#425b55">Separate platform safeguards from reading claims</text>
<rect x="32" y="128" width="656" height="163" rx="16" fill="#ffffff" stroke="#d6ded7"/>
<circle cx="64" cy="162" r="14" fill="#266455"/>
<path d="M58 162l4 4 8-9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="92" y="172" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#16352f">Platform checks</text>
<text x="92" y="207" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#425b55">Clear advisor profiles and current rates</text>
<text x="92" y="238" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#425b55">Published support and complaint terms</text>
<text x="92" y="269" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#425b55">Recent, detailed customer feedback</text>
<rect x="32" y="311" width="656" height="163" rx="16" fill="#ffffff" stroke="#d6ded7"/>
<circle cx="64" cy="345" r="14" fill="#266455"/>
<path d="M58 345l4 4 8-9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="92" y="355" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#16352f">Reading claims</text>
<text x="92" y="390" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#425b55">Keep notes of specific statements</text>
<text x="92" y="421" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#425b55">Separate impressions from outcomes</text>
<text x="92" y="452" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#425b55">Treat guaranteed predictions with caution</text>
<text x="36" y="520" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#61746c">PSYCHIC NETWORK REVIEWS</text>
